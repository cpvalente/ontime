<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="description" content="Login page for Ontime application" />
    <title>Ontime Login</title>
    <style>
      /* mirrors the client PinPage styles, see PinPage.module.scss */
      * {
        box-sizing: border-box;
      }

      html {
        height: 100%;
        font-size: 15px;
      }

      @media (max-width: 1600px) {
        html {
          font-size: 14px;
        }
      }

      body {
        margin: 0;
        /* place the card after the first quarter of the page */
        padding: 25vh 1rem 1rem;

        background: radial-gradient(ellipse at top, rgba(246, 246, 246, 0.05), transparent 60%) #101010;
        color: #f6f6f6;
        font-family: 'Open Sans', 'Segoe UI', sans-serif;
        line-height: 1.5;
        text-align: center;
      }

      .card {
        max-width: 22rem;
        margin: 0 auto;
        padding: 2.5rem 2rem 2rem;

        background-color: #1a1a1a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        box-shadow: rgba(0, 0, 0, 0.35) 0 1px 6px 3px;
      }

      .logo {
        display: block;
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }

      p {
        margin: 0.5rem 0 2rem;
        color: #b1b1b1;
      }

      input,
      button {
        display: block;
        width: 100%;
        height: 3rem;
        font: inherit;
        border: 1px solid transparent;
        border-radius: 3px;
      }

      input {
        padding: 0 0.75rem;
        background-color: #262626;
        color: #e2e2e2;
      }

      button {
        margin-top: 1rem;
        background-color: #2b5abc;
        color: #f6f6f6;
        font-weight: 600;
        cursor: pointer;
      }

      input:focus,
      button:focus {
        outline: 2px solid #578af4;
        outline-offset: 2px;
      }
    </style>
  </head>

      <h1>Welcome to Ontime</h1>
      <p>Enter the password to continue</p>
      <input type="hidden" name="redirect" value="" id="redirect" />
      <input
        type="password"
        name="password"
        placeholder="Password"
        aria-label="Password"
        required
        autofocus
        autocomplete="current-password"
      />
      <button type="submit">Log in</button>
    </form>
  </body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');
    if (redirect) {
      // Validate redirect URL to prevent open redirect attacks
      const isValidRedirect = redirect.startsWith('/') && !redirect.startsWith('//');
      if (isValidRedirect) {
        document.getElementById('redirect').value = redirect;
      }
    }
  </script>
