<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ontime</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-app-region: drag;
        background-color: #171719;
      }
      .container {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
      }
      .logo {
        display: block;
        width: 144px;
        height: 144px;
      }
      .loading-dots {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 16px;
      }
      .loading-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: #ff7597;
        animation: dot-hop 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .loading-dots span:nth-child(2) {
        animation-delay: 0.14s;
      }
      .loading-dots span:nth-child(3) {
        animation-delay: 0.28s;
      }
      @keyframes dot-hop {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.45;
        }
        30% {
          transform: translateY(-7px);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-dots span {
          animation: none;
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <div class="container" role="status" aria-label="Starting Ontime">
      <img class="logo" src="../assets/logo.png" alt="Ontime" width="144" height="144" />
      <div class="loading-dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </body>
</html>
