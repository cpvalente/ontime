name: Ontime build

on:
  push:
    tags: ['*']
  workflow_dispatch:

jobs:
  build_macos:
    runs-on: macOS-26

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import macOS code-signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/ontime-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate_path="$RUNNER_TEMP/ontime-signing.p12"

          trap 'rm -f "$certificate_path"' EXIT
          echo "::add-mask::$keychain_password"
          echo "ONTIME_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          printf '%s' "$CSC_LINK" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Electron - Build app
        env:
          APPLE_ID: ${{ secrets.APPLEID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLEIDPASS }}
          APPLE_TEAM_ID: ${{ secrets.TEAMID }}
        run: pnpm dist-mac --env-mode=loose
        timeout-minutes: 60

      - name: Remove macOS signing keychain
        if: always()
        run: |
          if [[ -f "$ONTIME_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$ONTIME_SIGNING_KEYCHAIN"
          fi

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ontime-macos-build
          path: |
            ./apps/electron/dist/ontime-macOS-x64.dmg
            ./apps/electron/dist/ontime-macOS-arm64.dmg
          retention-days: 1

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            ./apps/electron/dist/ontime-macOS-x64.dmg
            ./apps/electron/dist/ontime-macOS-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Electron - Build app
        run: pnpm dist-win

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ontime-windows-build
          path: |
            ./apps/electron/dist/ontime-win64.exe
            ./apps/electron/dist/win-unpacked/
          retention-days: 1

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: './apps/electron/dist/ontime-win64.exe'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Electron - Build app
        run: pnpm dist-linux

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ontime-linux-build
          path: |
            ./apps/electron/dist/ontime-linux-x86_64.AppImage
            ./apps/electron/dist/ontime-linux-arm64.AppImage
            ./apps/electron/dist/ontime-linux-armv7l.AppImage
          retention-days: 1

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            ./apps/electron/dist/ontime-linux-x86_64.AppImage
            ./apps/electron/dist/ontime-linux-arm64.AppImage
            ./apps/electron/dist/ontime-linux-armv7l.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
